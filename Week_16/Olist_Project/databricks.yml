bundle:
  name: olist_pipeline

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-ea968130-07af.cloud.databricks.com

resources:
  jobs:
    olist_brazillian_pipeline:
      name: olist_brazillian_pipeline
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./src/01_bronze_pipeline.py
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./src/02_silver_pipeline.py
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./src/03_gold_pipeline.py
      queue:
        enabled: true
